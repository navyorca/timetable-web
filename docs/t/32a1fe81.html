<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;700;800&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark"><title>종료된 시간표 링크</title><style>:root{--paper:#FFFFFF;--card:#FFFFFF;--ink:#0B1220;--ink-2:#2C3444;--line:#DCE6F5;--brand-ink:#1C3E92;--brand-soft:#E8EFFF;}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0A1128;--card:#111B3A;--ink:#EFF3FC;--ink-2:#C9D3E8;--line:#39456E;--brand-ink:#9CC4FF;--brand-soft:#16224A;}}@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}*{box-sizing:border-box}html,body{margin:0;padding:0}html{font-size:calc(16px * var(--scale,1))}body{background:var(--paper);color:var(--ink);font-size:1.1875rem;font-weight:400;line-height:1.8;word-break:keep-all;font-family:"Asta Sans","Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}main{max-width:640px;margin:0 auto;padding:48px 20px 64px}h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em;line-height:1.42;margin:0 0 16px}p{margin:0 0 16px}ol{margin:0;padding-left:24px}li{margin-bottom:12px}.card{background:var(--card);border-radius:12px;border-bottom:2px solid var(--line);padding:28px 24px;margin-top:28px}.card h2{font-size:1.3125rem;font-weight:700;margin:0 0 12px}.note{background:var(--brand-soft);color:var(--ink-2);border-radius:12px;padding:16px 18px;font-size:1.125rem;margin-top:24px}a{color:var(--brand-ink);font-weight:700}a:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px}</style></head><body><main><h1>이 시간표 링크는 닫혔습니다</h1><p>수강이 끝났거나 담당 멘토가 바뀌어 이 링크는 닫혔습니다.</p><div class="card"><h2>문의</h2><p>수강 내역이나 환불 진행 상황이 궁금하시면 담당 멘토에게 연락 주세요. 재등록하시면 새 시간표 링크를 다시 보내 드립니다.</p></div><p class="note">이 주소는 비어 있습니다. 개인 정보는 전부 지워졌습니다.</p></main><footer>SBS아카데미 AIX학원 강남지점</footer></body></html>
